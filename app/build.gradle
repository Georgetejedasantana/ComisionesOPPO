plugins { id 'com.android.application' }
android {
    namespace 'mx.comisiones.oppo'
    compileSdk 35
    defaultConfig {
        applicationId 'mx.comisiones.oppo'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    def releaseStore = System.getenv('OPPO_KEYSTORE_PATH')
    if (releaseStore) {
        signingConfigs {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('OPPO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('OPPO_KEY_ALIAS')
                keyPassword System.getenv('OPPO_KEY_PASSWORD')
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
