name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK de prueba y comprobar firma
        run: |
          gradle --no-daemon :app:assembleDebug :app:lintDebug
          mkdir -p salida
          cp app/build/outputs/apk/debug/app-debug.apk salida/ComisionesOPPO-prueba.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose salida/ComisionesOPPO-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ComisionesOPPO-APK-prueba
          path: salida/ComisionesOPPO-prueba.apk
          if-no-files-found: error
