name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK de prueba y comprobar firma
        run: |
          gradle --no-daemon :app:assembleDebug :app:lintDebug
          mkdir -p salida
          cp app/build/outputs/apk/debug/app-debug.apk salida/ComisionesOPPO-prueba.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose salida/ComisionesOPPO-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ComisionesOPPO-APK-prueba
          path: salida/ComisionesOPPO-prueba.apk
          if-no-files-found: error
  prueba-android:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ComisionesOPPO-APK-prueba
          path: salida
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar y abrir el APK en Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install salida/ComisionesOPPO-prueba.apk
            adb shell am start -W -n mx.comisiones.oppo/.MainActivity | tee inicio.txt
            grep -q 'Status: ok' inicio.txt
            sleep 10
            adb shell pidof mx.comisiones.oppo
            adb shell dumpsys activity activities | grep -E '(mResumedActivity|topResumedActivity).*mx.comisiones.oppo/.MainActivity'
